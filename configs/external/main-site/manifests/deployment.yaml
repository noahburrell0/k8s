apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-site
  labels:
    app.kubernetes.io/name: main-site
    app.kubernetes.io/instance: main-site
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: main-site
      app.kubernetes.io/instance: main-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: main-site
        app.kubernetes.io/instance: main-site
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: site-content
              mountPath: /git
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi

        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.6.0
          env:
            - name: GITSYNC_REPO
              value: git@github.com:noahburrell0/burrell-tech.git
            - name: GITSYNC_REF
              value: main
            - name: GITSYNC_ROOT
              value: /git
            - name: GITSYNC_LINK
              value: current
            - name: GITSYNC_PERIOD
              value: "30s"
            - name: GITSYNC_SPARSE_CHECKOUT_FILE
              value: /etc/git-sync/sparse-checkout
            - name: GITSYNC_MAX_FAILURES
              value: "-1"
          volumeMounts:
            - name: site-content
              mountPath: /git
            - name: sparse-patterns
              mountPath: /etc/git-sync
            - name: git-sync-ssh
              mountPath: /etc/git-secret
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            # 65533 is git-sync's built-in nonroot user; it exists in the image's
            # /etc/passwd, which OpenSSH requires (uid 65534 does not, and would
            # otherwise need GITSYNC_ADD_USER=true).
            runAsUser: 65533
            runAsGroup: 65533

      # fsGroup makes the root-owned, 0400 SSH key readable by git-sync's group.
      securityContext:
        fsGroup: 65533

      volumes:
        - name: site-content
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: main-site-nginx-config
        - name: sparse-patterns
          configMap:
            name: git-sync-sparse-checkout
        - name: git-sync-ssh
          secret:
            secretName: git-sync-ssh
            # 0400 = not group/world readable, as OpenSSH requires for a key.
            defaultMode: 0400
